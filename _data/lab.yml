name: AEE-Lab
subtitle: 汽车能源电子实验室
headline: 欢迎来到 AEE-Lab
description: 聚焦新概念电池设计与制造、电池管理系统软硬件开发及电池新技术产业化应用。
about: |
  AEE-Lab（汽车能源电子实验室）围绕电池材料与器件、管理系统软硬件，以及新技术的产业化应用开展研究。

  这里记录我们的研究探索、项目实践与技术积累，也让关注新能源电池与储能技术的朋友更好地认识我们。
email: hrxia@fzu.edu.cn
address: 福州大学车辆工程实验楼
recruitment: 欢迎机械、电子、材料、计算机等相关背景，自驱力强、具备良好团队协作精神的博士后、研究生和优秀本科生加入汽车能源电子实验室，共同推进新能源与智能车辆领域的技术突破。
directions:
  - title: 新概念电池设计与制造
    description: 面向热安全的耐火电解质与高安全电池、极速快充电池核心技术
    icon: fas fa-battery-full
  - title: 电池管理系统软硬件开发
    description: 面向能量优化管理的专用集成电路、电池智能状态估计算法与闭环管控体系
    icon: fas fa-microchip
  - title: 电池新技术产业化应用
    description: 高性能动力电池系统集成、新型储能装备开发与工程落地。
    icon: fas fa-industry
